version: "3"

tasks:
  dev:
    desc: "Run dev server via docker compose"
    cmds:
      - docker compose up --build app

  shell:
    desc: "Open a bash shell in the dev container"
    cmds:
      - docker compose run --rm app bash

  console:
    desc: "Rails console"
    cmds:
      - docker compose run --rm app bin/rails console

  migrate:
    desc: "Run pending migrations"
    cmds:
      - docker compose run --rm app bin/rails db:migrate

  backfill-history:
    desc: "Backfill EpicEvent timestamps from Jira's changelog (one-time fix for the initial rollout)"
    cmds:
      - docker compose run --rm app bin/rails epic_events:backfill

  discover-closed-epics:
    desc: "Find epics already closed (SUCCESS/FAILURE/REJECTED/etc) before this app ever tracked them, and backfill their history"
    cmds:
      - docker compose run --rm app bin/rails epic_events:discover_closed

  lint:
    desc: "Run RuboCop (matches CI lint job)"
    cmds:
      - docker compose run --rm app bin/rubocop

  lint:fix:
    desc: "Run RuboCop with safe autocorrect"
    cmds:
      - docker compose run --rm app bin/rubocop -A

  test:
    desc: "Run lint + all tests (unit + system) — matches CI"
    cmds:
      - task: lint
      - docker compose run --rm app bin/rails test
      - docker compose run --rm --use-aliases app bin/rails test:system

  logs:
    desc: "Tail app logs"
    cmds:
      - docker compose logs -f app

  redeploy:
    desc: "Rebuild and restart the prod stack (run on the Hetzner box after git pull)"
    # Migrations are not run here on purpose. bin/docker-entrypoint runs
    # db:prepare whenever the container command contains "server", which the
    # prod CMD does, so the app migrates itself on boot. Running db:migrate as a
    # second step raced that: `up -d` returns when the container starts, not when
    # it is ready, so the two could collide on a half-initialised database.
    # bin/docker-entrypoint uses `bash -e`, so a failed migration stops the
    # container rather than silently serving an old schema -- check `task prod-logs`.
    cmds:
      - docker compose -f docker-compose.prod.yml up -d --build

  prod-logs:
    desc: "Tail prod app logs"
    cmds:
      - docker compose -f docker-compose.prod.yml logs -f app
