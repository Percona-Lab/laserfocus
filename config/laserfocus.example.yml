auth:
  allowed_domains: ["example.com"]
  allowed_emails: []

polling:
  tick_seconds: 60
  active_window_minutes: 5
  idle_interval_minutes: 60

board:
  epic_query: 'issuetype = Epic AND project = PG AND labels = "Priority" AND statusCategory != Done'
  # Optional. Used by `rails epic_events:discover_closed` to backfill goal
  # history for epics that reached a terminal status before this app started
  # tracking them. Mirror epic_query but flip the status filter.
  closed_epics_query: 'issuetype = Epic AND project = PG AND labels = "Priority" AND statusCategory = Done'
  # Optional. Issues that should appear in a leftmost "Unplanned" column.
  # Match all candidate tickets here (e.g. by Priority label); JiraSync will
  # exclude any whose parent is a tracked epic. Author the JQL with your own
  # recency clause if you want to also include recently-completed tickets,
  # e.g.: (statusCategory != Done OR resolved >= -7d)
  unplanned_query: 'project = PG AND labels = "Priority" AND issuetype != Epic AND (statusCategory != Done OR resolved >= -7d)'
  new_unplanned_query: 'project = PG AND issuetype != Epic AND statusCategory = "To Do" AND created >= -10d'
  new_unplanned_days: 10
  users:
    - { jira_username: "alice", display_name: "Alice" }
    - { jira_username: "bob",   display_name: "Bob" }
  status_map:
    "Open":        "new"
    "To Do":       "new"
    "In Progress": "in_progress"
    "In Review":   "review"
    "Done":        "done"
  # Optional. Epics with this label are continuous work (upstream, community)
  # rather than something that finishes, so the board tags them as their own
  # lane instead of flagging them as stalled.
  ongoing_label: "Ongoing"
  # Optional. Epics with this label get a "community" tag on the board and are
  # listed on their own Community view. They still need the Priority label.
  # ongoing_label also takes a list, e.g. ["Ongoing", "Community"], for
  # community epics that never finish.
  community_label: "Community"
  new_statuses:  ["new"]
  done_statuses: ["done"]
  staleness:
    somewhat_days: 7
    really_days:   21
  ignore_staleness_for_new_issues: true

# Optional. Jira Product Discovery roadmap, used to check that what the roadmap
# commits to "Now" is actually visible on the board, and to render the Next view.
# Leave the whole section out to switch the roadmap features off.
discovery:
  now_query:  'project = PGR AND issuetype = Idea AND cf[11275] = "Now"'
  next_query: 'project = PGR AND issuetype = Idea AND cf[11275] = "Next"'
  # The issue link type JPD creates for delivery tickets ("Polaris work item link").
  delivery_link_type_id: "10016"
  # Custom field ids on the idea. horizon_field is the Now/Next/Later select;
  # incubator_field is the readiness lifecycle the Next view ranks by.
  horizon_field: "customfield_11275"
  incubator_field: "customfield_11290"
  rank_field: "customfield_10019"
