auth:
  allowed_domains: ["example.com"]
  allowed_emails: []

polling:
  tick_seconds: 60
  active_window_minutes: 5
  idle_interval_minutes: 60

board:
  epic_query: 'issuetype = Epic AND project = PG AND labels = "Priority" AND statusCategory != Done'
  # Optional. Used by `rails epic_events:discover_closed` to backfill goal
  # history for epics that reached a terminal status before this app started
  # tracking them. Mirror epic_query but flip the status filter.
  closed_epics_query: 'issuetype = Epic AND project = PG AND labels = "Priority" AND statusCategory = Done'
  # Optional. Issues that should appear in a leftmost "Unplanned" column.
  # Match all candidate tickets here (e.g. by Priority label); JiraSync will
  # exclude any whose parent is a tracked epic. Author the JQL with your own
  # recency clause if you want to also include recently-completed tickets,
  # e.g.: (statusCategory != Done OR resolved >= -7d)
  unplanned_query: 'project = PG AND labels = "Priority" AND issuetype != Epic AND (statusCategory != Done OR resolved >= -7d)'
  new_unplanned_query: 'project = PG AND issuetype != Epic AND statusCategory = "To Do" AND created >= -10d'
  new_unplanned_days: 10
  # The Reviews view links people to GitHub by name: a GitHub login whose
  # profile name matches display_name (ignoring case and accents) is that
  # person. Add github: only where the names differ. email: ties a Google login
  # to an entry when the Google account name differs from display_name.
  users:
    - { jira_username: "alice", display_name: "Alice", github: "alice-gh", email: "alice@example.com" }
    - { jira_username: "bob",   display_name: "Bob" }
  status_map:
    "Open":        "new"
    "To Do":       "new"
    "In Progress": "in_progress"
    "In Review":   "review"
    "Done":        "done"
  # Optional. Epics with this label are continuous work (upstream, community)
  # rather than something that finishes, so the board tags them as their own
  # lane instead of flagging them as stalled.
  ongoing_label: "Ongoing"
  # Optional. Epics with this label (they still need the Priority label) move
  # from the main board to their own Community view.
  # ongoing_label also takes a list, e.g. ["Ongoing", "Community"], for
  # community epics that never finish.
  community_label: "Community"
  new_statuses:  ["new"]
  done_statuses: ["done"]
  staleness:
    somewhat_days: 7
    really_days:   21
    # Right-clicking a stale ticket on the board snoozes it for this many days:
    # it shows as fresh (with a moon on its age) and drops out of the stale
    # counts. The snooze ends early when the ticket changes status.
    snooze_days:   7
    # All three thresholds above fire this many minutes early (default 60), so
    # a ticket moved or snoozed during the daily standup is flagged again by
    # the start of the same standup days later.
    lead_minutes:  60
  ignore_staleness_for_new_issues: true

# Optional. Jira Product Discovery roadmap, used to check that what the roadmap
# commits to "Now" is actually visible on the board, and to render the Next view.
# Leave the whole section out to switch the roadmap features off.
discovery:
  now_query:  'project = PGR AND issuetype = Idea AND cf[11275] = "Now"'
  next_query: 'project = PGR AND issuetype = Idea AND cf[11275] = "Next"'
  # The issue link type JPD creates for delivery tickets ("Polaris work item link").
  delivery_link_type_id: "10016"
  # Custom field ids on the idea. horizon_field is the Now/Next/Later select;
  # incubator_field is the readiness lifecycle the Next view ranks by.
  horizon_field: "customfield_11275"
  incubator_field: "customfield_11290"
  rank_field: "customfield_10019"
  # Optional. Landing quarters, internal only. roadmap_query reads every idea
  # with its changelog. time_id_layout says how to read the Time-ID field; it is
  # deliberately not documented here, take it from the internal docs. Without
  # it the feature stays off. Codenames are learned from the ideas themselves.
  # Set landing_quarters: false for a team that does not use Time-IDs: nothing
  # is synced, tagged or flagged then.
  landing_quarters: true
  roadmap_query: 'project = PGR AND issuetype = Idea'
  time_id_field: "customfield_11385"
  time_id_layout: "<see internal docs>"
  codename_field: "customfield_11386"

# Optional. The Reviews view: open, ready-for-review (non-draft) PRs in these
# GitHub repos, grouped by who they wait on. Needs GITHUB_TOKEN in .env (a
# read-only token; LaserFocus never writes to GitHub). Leave the section out to
# switch the view and its tab off.
reviews:
  repos:
    - acme/server
    - acme/docs
  # Logins whose PRs never show, e.g. dependency bots.
  exclude_authors: ["dependabot[bot]", "renovate[bot]"]
  # Days a PR may wait on reviewers (or on a merge) before it is flagged stale,
  # then critical. Critical PRs are counted in red on the Reviews tab.
  staleness:
    somewhat_days: 3
    really_days:   7
  # The same while the PR waits on its own author (changes requested, or
  # questions not answered yet).
  author_staleness:
    somewhat_days: 7
    really_days:   14
  # A PR open this many days gets "decision needed": merge it, close it, or
  # snooze it with the reason it stays open.
  decision_days: 30

# Optional. The Issues view: open GitHub issues, by default in the reviews repos
# above (and with its exclude_authors). On whenever reviews is set up; write
# `issues: false` to switch it off. Everything below is optional.
# issues:
#   repos: ["acme/server"]
#   # Days before an issue is stale, then critical, per column: waiting on the
#   # team (New, Waiting on us), on the reporter, and the team's own backlog.
#   staleness:
#     team:     { somewhat_days: 3,  really_days: 7 }
#     reporter: { somewhat_days: 14, really_days: 30 }
#     backlog:  { somewhat_days: 30, really_days: 90 }
#   # An issue open this many days gets "decision needed".
#   decision_days: 90
